# Manual: prints the text of a website into the job log (home page + up to
# N same-site pages). Used to read the Soul Sync concept site.
name: Read website text

on:
  workflow_dispatch:
    inputs:
      url:
        description: Site to read
        default: https://soulsyncmode.com/
      pages:
        description: Max pages
        default: '12'

jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        working-directory: soul-sync/e2e
        run: |
          npm init -y >/dev/null
          npm i playwright@1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Read the site
        working-directory: soul-sync/e2e
        env:
          SITE_URL: ${{ inputs.url }}
          MAX_PAGES: ${{ inputs.pages }}
        run: node read-site.mjs "$SITE_URL" "$MAX_PAGES"
