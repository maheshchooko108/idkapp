# Manual: prints the text of a website into the job log (home page + up to
# N same-site pages). Used to read the Soul Sync concept site.
name: Read website text

on:
  workflow_dispatch:
    inputs:
      url:
        description: Site to read
        default: https://soulsyncmode.com/
      pages:
        description: Max pages (read) or max steps (walk)
        default: '12'
      mode:
        description: read = page text; walk = click through the flow from the start button
        default: read
      start:
        description: Start button text (walk mode)
        default: "I'm Ready"


jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        working-directory: soul-sync/e2e
        run: |
          npm init -y >/dev/null
          npm i playwright@1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Read the site
        working-directory: soul-sync/e2e
        env:
          SITE_URL: ${{ inputs.url }}
          MAX_PAGES: ${{ inputs.pages }}
          MODE: ${{ inputs.mode }}
          START: ${{ inputs.start }}
        run: |
          if [ "$MODE" = walk ]; then node walk-site.mjs "$SITE_URL" "$START" "$MAX_PAGES"
          else node read-site.mjs "$SITE_URL" "$MAX_PAGES"; fi
