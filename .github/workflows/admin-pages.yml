# Publishes to GitHub Pages:
#   /      the admin dashboard (soul-sync/admin)
#   /app/  a web preview of the app (soul-sync/app, Expo web export)
# The Supabase URL and *anon* key are public by design; row-level security
# limits every user to their own rows and the dashboard to admins. The
# service_role key is never fetched or written.
#
# One-time setup: Settings → Pages → Source: "GitHub Actions".
name: Publish admin dashboard and app preview

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'soul-sync/admin/**'
      - 'soul-sync/app/**'
      - 'soul-sync/shared/**'
      - '.github/workflows/admin-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  SUPABASE_PROJECT_REF: qzanlsxbaxlmmakvloge
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Write config.js with the public anon key
        id: anon
        working-directory: soul-sync/admin
        run: |
          anon=$(supabase projects api-keys --project-ref "$SUPABASE_PROJECT_REF" -o json \
            | jq -r '[.[] | select(.name == "anon")][0].api_key')
          if [ -z "$anon" ] || [ "$anon" = "null" ]; then echo "::error::Could not read the anon key"; exit 1; fi
          echo "key=$anon" >> "$GITHUB_OUTPUT"
          cat > config.js <<JS
          window.SOUL_SYNC_CONFIG = {
            supabaseUrl: 'https://$SUPABASE_PROJECT_REF.supabase.co',
            supabaseAnonKey: '$anon',
          };
          JS
          node --check config.js

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: soul-sync/app/package-lock.json

      - name: Build the app's web preview
        working-directory: soul-sync/app
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://${{ env.SUPABASE_PROJECT_REF }}.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ steps.anon.outputs.key }}
          EXPO_NO_TELEMETRY: '1'
        run: |
          npm ci
          npx tsc --noEmit
          npx expo export -p web --output-dir dist

      - name: Assemble the site
        run: |
          mkdir -p site
          cp -r soul-sync/admin/. site/
          cp -r soul-sync/app/dist site/app
          # Pages serves the root 404.html for unknown paths; the app's shell
          # handles deep links like /app/today on reload.
          cp site/app/index.html site/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
