# OPTIONAL. Cards already compute charts in-process (supabase/functions/
# _shared/vedic.ts, tested against Swiss Ephemeris). Run this only if you want
# the Swiss Ephemeris service itself live: it deploys soul-sync/astro to
# Fly.io and points the Supabase card engine at it.
#
# Needs one more repository secret: FLY_API_TOKEN (fly.io → Account →
# Access Tokens). Uses the existing SUPABASE_ACCESS_TOKEN to set the engine's
# ASTRO_URL / ASTRO_API_KEY secrets.
#
# Each run issues a fresh shared key and sets it on both sides, so nobody has
# to copy it anywhere and a deploy also rotates it.
name: Deploy astro service

on:
  workflow_dispatch:

concurrency:
  group: astro-deploy
  cancel-in-progress: false

env:
  FLY_APP: soul-sync-astro-qzanlsx
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
  SUPABASE_PROJECT_REF: qzanlsxbaxlmmakvloge
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: soul-sync/astro
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets are set
        run: |
          missing=0
          [ -n "$FLY_API_TOKEN" ] || { echo "::error::Add the FLY_API_TOKEN repository secret"; missing=1; }
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || { echo "::error::Add the SUPABASE_ACCESS_TOKEN repository secret"; missing=1; }
          exit $missing

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Chart tests
        run: |
          pip install -q -r requirements.txt pytest httpx
          pytest -q

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Create the Fly app on first run
        run: flyctl status --app "$FLY_APP" >/dev/null 2>&1 || flyctl apps create "$FLY_APP" --org personal

      - name: Issue a fresh shared key
        id: key
        run: |
          key=$(openssl rand -hex 32)
          echo "::add-mask::$key"
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Deploy
        env:
          ASTRO_KEY: ${{ steps.key.outputs.key }}
        run: |
          flyctl secrets set ASTRO_API_KEY="$ASTRO_KEY" --app "$FLY_APP" --stage
          flyctl deploy --app "$FLY_APP" --remote-only --ha=false

      - name: Smoke test
        env:
          ASTRO_KEY: ${{ steps.key.outputs.key }}
        run: |
          url="https://$FLY_APP.fly.dev"
          curl -sf --retry 5 --retry-delay 3 "$url/health"
          echo
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$url/chart" -H 'content-type: application/json' \
            -d '{"birth_date":"1990-06-15","tz":"UTC","lat":0,"lon":0}')
          echo "chart without key returned $code (401 expected)"; [ "$code" = "401" ]
          curl -sf -X POST "$url/chart" -H 'content-type: application/json' -H "x-astro-key: $ASTRO_KEY" \
            -d '{"birth_date":"1990-06-15","birth_time":"08:30","tz":"America/Port_of_Spain","lat":10.65,"lon":-61.52}' \
            | jq '{natal_moon, dasha}'

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Point the card engine at the service
        env:
          ASTRO_KEY: ${{ steps.key.outputs.key }}
        run: |
          supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" \
            ASTRO_URL="https://$FLY_APP.fly.dev" ASTRO_API_KEY="$ASTRO_KEY"
