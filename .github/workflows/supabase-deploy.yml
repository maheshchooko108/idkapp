# Deploys the Soul Sync backend to Supabase: database migrations and edge
# functions. Runs on demand (Actions tab → "Deploy Supabase" → Run workflow)
# and whenever backend code changes on master.
#
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  personal token from supabase.com/dashboard/account/tokens
#   SUPABASE_DB_PASSWORD   the project's database password
# ANTHROPIC_API_KEY is set in the Supabase dashboard (Edge Functions → Secrets), not here.
name: Deploy Supabase

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'soul-sync/supabase/**'
      - 'soul-sync/shared/**'

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_REF: qzanlsxbaxlmmakvloge
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: soul-sync
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets are set
        run: |
          missing=0
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || { echo "::error::Add the SUPABASE_ACCESS_TOKEN repository secret"; missing=1; }
          [ -n "$SUPABASE_DB_PASSWORD" ] || { echo "::error::Add the SUPABASE_DB_PASSWORD repository secret"; missing=1; }
          exit $missing

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Shared core tests (also checks the function copies are in sync)
        run: cd shared && npm test

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Vedic chart matches Swiss Ephemeris (400 reference charts)
        run: deno test --allow-read supabase/tests/vedic.test.ts

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Apply database migrations
        run: supabase db push --linked --password "$SUPABASE_DB_PASSWORD"

      - name: Deploy edge functions
        # --use-api bundles on Supabase's side, so no Docker is needed here.
        # push-cards keeps verify_jwt = false from supabase/config.toml.
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF" --use-api

      - name: Smoke test
        run: |
          base="https://$SUPABASE_PROJECT_REF.supabase.co"
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$base/functions/v1/daily-card")
          echo "daily-card without a login returned $code (401 means deployed and guarding)"
          [ "$code" = "401" ]
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$base/functions/v1/push-cards")
          echo "push-cards without the cron secret returned $code (403 expected)"
          [ "$code" = "403" ]
