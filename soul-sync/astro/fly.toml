# Fly.io config for the astro service. Deployed by
# .github/workflows/astro-deploy.yml; machines sleep when idle and wake in
# about two seconds, which keeps the pilot's cost near zero.
app = "soul-sync-astro-qzanlsx"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "256mb"
